name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable release version, without v (existing versions may be published again safely)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: posturepal-release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Prepare and publish release
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Configure release identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Prepare or verify selected release
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            case "$GITHUB_REF" in
              refs/heads/main|refs/heads/develop) ;;
              *) echo 'Manual releases must run from main or develop.' >&2; exit 1 ;;
            esac
            python scripts/release.py prepare "$REQUESTED_VERSION"
          else
            python scripts/release.py verify --tag "$GITHUB_REF_NAME"
          fi
          python scripts/release.py notes --output "$RUNNER_TEMP/release-notes.md"
      - name: Push release commit and tag together
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: git push --atomic origin "HEAD:$GITHUB_REF" "refs/tags/$RELEASE_TAG"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving it unchanged."
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "PosturePal $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
