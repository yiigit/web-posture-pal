[project]
name = "posturepal"
version = "0.12.1"
description = "A modular sitting habit coach — Movement & Exercise Library"
requires-python = ">=3.11"
dependencies = ["fastapi==0.115.12", "uvicorn==0.34.2", "tzdata==2025.2", "SQLAlchemy==2.0.55", "PyMySQL[rsa]==1.2.3"]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "commitizen==4.19.3"]

[tool.pytest.ini_options]
pythonpath = ["backend"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
version_scheme = "semver"
tag_format = "v$version"
annotated_tag = true
major_version_zero = true
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
changelog_incremental = true
bump_message = "chore(release): $current_version → $new_version"
version_files = [
    "VERSION",
    "compose.yaml:image:",
    "frontend/src/main.js",
    "frontend/src/breaks.js",
    "frontend/src/dashboard.js",
    "README.md:Current release:",
]
