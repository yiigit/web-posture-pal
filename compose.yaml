services:
  posturepal:
    build: .
    image: posturepal:0.11.0
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      POSTUREPAL_ADMIN_TOKEN: ${POSTUREPAL_ADMIN_TOKEN:?Set POSTUREPAL_ADMIN_TOKEN in .env to a random token of at least 32 characters}
      POSTUREPAL_SECURE_COOKIES: ${POSTUREPAL_SECURE_COOKIES:-false}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-posturepal}
      MYSQL_USER: ${MYSQL_USER:-posturepal}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      POSTUREPAL_DEMO_PASSWORD: ${POSTUREPAL_DEMO_PASSWORD:-}
    volumes:
      - posturepal-data:/legacy:ro
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    init: true
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-posturepal}
      MYSQL_USER: ${MYSQL_USER:-posturepal}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u\"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    restart: unless-stopped
volumes:
  posturepal-data:
  mysql-data:
